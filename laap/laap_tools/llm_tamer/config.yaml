# LLM Tamer — 认知控制配置
# 偏置系数和温度范围可在此调整。
# Token 映射使用 Holo-3.1-9B (llama.cpp :8082) 的实际 token ID。

# ── llama.cpp 本地模型配置 ──
llama_cpp:
  default_url: "http://localhost:8082"
  fallback_url: "http://localhost:11520"
  max_tokens: 2048
  default_temperature: 0.7
  timeout_seconds: 30

# ── DeepSeek API 降级配置 ──
deepseek:
  temperature_range: [0.2, 1.5]
  default_temperature: 0.7
  prompt_prefix_template: |
    [Cognitive State]
    - Emotion: {emotion}
    - Attention: {attention}
    - Certainty: {certainty:.2f}
    - Competence: {competence:.2f}

# ── 偏置强度系数 ──
bias_strength:
  attention: 1.0
  emotion: 0.7
  needs: 0.5
  meta: 0.8

# ── 温度映射 ──
temperature:
  min: 0.2
  max: 1.5
  focused_threshold: 0.7
  focused_temp: 0.4
  normal_temp: 0.7
  exploratory_temp: 1.0

# ── Token 映射 ──
# 按模型分拆，每个模型单独设置 token ID
# 已用对应模型的 /tokenize API 校准
